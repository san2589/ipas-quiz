<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>iPAS AI 模擬考系統</title>
  <style>
    :root { --bg:#0b1220; --card:#121a2a; --muted:#94a3b8; --text:#e5e7eb; --brand:#14b8a6; --danger:#ef4444; --ok:#22c55e; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:linear-gradient(180deg,#071023,#0b1220 40%); color:var(--text); min-height: 100vh; }
    .wrap{ max-width:1100px; margin:0 auto; padding:16px; }
    .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; }
    .brand{ font-weight:900; letter-spacing:.5px; font-size: 1.2rem; }
    .card{ background:rgba(18,26,42,.92); border:1px solid rgba(148,163,184,0.18); border-radius:16px; padding:20px; box-shadow: 0 10px 30px rgba(0,0,0,.28); margin-bottom: 12px;}
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .grid{ display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width: 920px){ .grid{ grid-template-columns: 1.4fr .6fr; } }
    .muted{ color:var(--muted); font-size: 0.9rem; }
    .kbd{ font-family: ui-monospace, monospace; font-size:12px; padding:2px 6px; border-radius:8px; border:1px solid rgba(148,163,184,.25); background:rgba(2,6,23,.35); color:#d6dee9; }
    .btn{ appearance:none; border:0; border-radius:12px; padding:10px 16px; cursor:pointer; background:rgba(20,184,166,0.14); color:#c7fff6; border:1px solid rgba(20,184,166,0.45); font-weight:800; transition: 0.2s; }
    .btn:hover:not(:disabled){ background:var(--brand); color:white; }
    .btn-active { background:var(--brand) !important; color:white !important; }
    .progress{ height:8px; background:rgba(148,163,184,0.14); border-radius:999px; overflow:hidden; }
    .bar{ height:100%; width:0%; background:linear-gradient(90deg, #14b8a6, #22c55e); transition: 0.4s; }
    .opt{ width:100%; text-align:left; padding:16px; border-radius:14px; border:1px solid rgba(148,163,184,0.22); background:rgba(2,6,23,0.35); color:var(--text); cursor:pointer; margin-bottom:12px; }
    .opt.selected{ outline:2px solid var(--brand); background: rgba(20,184,166,0.1); }
    .opt.correct{ border-color:var(--ok); background:rgba(34,197,94,0.15); color:#d6ffe2; font-weight: bold; }
    .opt.wrong{ border-color:var(--danger); background:rgba(239,68,68,0.15); color:#ffd2d2; }
    .miniGrid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(35px, 1fr)); gap:6px; }
    .qdot{ border-radius:8px; padding:8px 0; text-align:center; font-size:11px; border:1px solid rgba(148,163,184,0.22); cursor:pointer; }
    .qdot.active{ outline:2px solid var(--brand); background: var(--brand); color: white; }
    .exp-box { margin-top:20px; padding:15px; background:rgba(20,184,166,0.1); border-radius:10px; border-left:4px solid var(--brand); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">iPAS AI 模擬考系統</div>
      <div id="timerDisplay" class="kbd">--:--</div>
    </div>
    <div class="grid">
      <div class="card">
        <div class="row" style="justify-content:space-between; margin-bottom:20px;">
          <div class="row">
            <button class="btn" id="btnAll" onclick="switchLib('./ipas_questions_all.json')">全部題庫</button>
            <button class="btn" id="btnAi" onclick="switchLib('./ipas_questions_ai.json')">AI 規劃師</button>
          </div>
          <button class="btn" style="background:rgba(239,68,68,0.2)" onclick="clearProgress()">重新抽題</button>
        </div>
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div id="quizArea" style="margin-top:20px;">載入中...</div>
        <div class="row" style="margin-top:25px; justify-content:space-between;">
          <button class="btn" onclick="move(-1)">上一題</button>
          <div class="row">
            <button class="btn" id="btnReveal" onclick="reveal()">看答案</button>
            <button class="btn" id="btnSubmit" onclick="submitExam()">送出交卷</button>
            <button class="btn" onclick="move(1)">下一題</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div id="navGrid" class="miniGrid"></div>
        <div id="resultBox" style="display:none; margin-top:20px;">
            <div id="finalScore" style="padding:15px; border-radius:12px; background:rgba(2,6,23,0.5); font-size:24px; text-align:center;"></div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
    // 預設讀取 ipas_questions_ai.json
    let libUrl = localStorage.getItem("ipas_active_url") || "./ipas_questions_ai.json";
    const LS_STATE_KEY = "ipas_save_" + libUrl;
    const LS_QUESTIONS_KEY = "ipas_questions_data_" + libUrl;

    let bank = [], currentIdx = 0, answers = {}, revealed = {}, submitted = false;
    let timeLeft = parseInt(localStorage.getItem("exam_time")) || 3600;

    window.switchLib = (url) => {
        localStorage.setItem("ipas_active_url", url);
        // 切換題庫時，清除舊的隨機題目，強制重新抓取
        localStorage.removeItem("ipas_questions_data_" + url); 
        location.reload();
    };

    window.clearProgress = () => { if(confirm("確定重置進度？")) { localStorage.clear(); location.reload(); } };

    async function init() {
        // 設定按鈕高亮
        document.getElementById("btnAi").classList.toggle("btn-active", libUrl.includes("ai"));
        document.getElementById("btnAll").classList.toggle("btn-active", libUrl.includes("all"));

        try {
            const cached = localStorage.getItem(LS_QUESTIONS_KEY);
            if (cached) {
                bank = JSON.parse(cached);
            } else {
                const res = await fetch(libUrl + "?v=" + Date.now());
                const text = await res.text();
                
                // 強健解析邏輯：解決 ID 67 重複或中間斷掉的問題
                const matches = text.match(/\{[\s\S]*?"id"[\s\S]*?\}/g);
                const ansMap = {"A":0,"B":1,"C":2,"D":3};
                let fullBank = [];

                matches.forEach(m => {
                    try {
                        let clean = m.trim().replace(/,$/, "");
                        if(!clean.endsWith("}")) clean += "}";
                        const q = JSON.parse(clean);
                        fullBank.push({
                            id: q.id,
                            title: q.question,
                            opts: [q.options.A, q.options.B, q.options.C, q.options.D],
                            ans: ansMap[q.answer],
                            exp: q.analysis
                        });
                    } catch(e) {}
                });

                // 隨機抽 50 題
                for (let i = fullBank.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [fullBank[i], fullBank[j]] = [fullBank[j], fullBank[i]];
                }
                bank = fullBank.slice(0, 50);
                localStorage.setItem(LS_QUESTIONS_KEY, JSON.stringify(bank));
            }

            const saved = JSON.parse(localStorage.getItem(LS_STATE_KEY) || "{}");
            answers = saved.answers || {};
            currentIdx = saved.currentIdx || 0;
            submitted = saved.submitted || false;
            render();
            startTimer();
        } catch(e) {
            document.getElementById("quizArea").innerHTML = "載入失敗，請檢查 " + libUrl + " 是否存在。";
        }
    }

    function startTimer() {
        setInterval(() => {
            if(submitted || timeLeft <= 0) return;
            timeLeft--;
            const m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById("timerDisplay").textContent = `${m}:${s<10?'0':''}${s}`;
        }, 1000);
    }

    function render() {
        const q = bank[currentIdx]; if(!q) return;
        const isRev = submitted || revealed[currentIdx];
        let html = `<h3>${currentIdx+1}. ${q.title}</h3>`;
        q.opts.forEach((opt, i) => {
            let cls = "opt";
            if(answers[currentIdx] === i) cls += " selected";
            if(isRev) cls += (i === q.ans ? " correct" : (answers[currentIdx]===i?" wrong":""));
            html += `<button class="${cls}" onclick="choose(${i})">${opt}</button>`;
        });
        if(isRev && q.exp) html += `<div class="exp-box">解析：${q.exp}</div>`;
        document.getElementById("quizArea").innerHTML = html;
        document.getElementById("bar").style.width = ((currentIdx+1)/bank.length*100) + "%";
        renderNav();
    }

    function renderNav() {
        document.getElementById("navGrid").innerHTML = bank.map((q, i) => {
            let cls = "qdot";
            if(i === currentIdx) cls += " active";
            if(answers[i] !== undefined) cls += " ok";
            return `<div class="${cls}" onclick="currentIdx=${i};render()">${i+1}</div>`;
        }).join('');
    }

    window.choose = (i) => { if(!submitted) { answers[currentIdx] = i; render(); localStorage.setItem(LS_STATE_KEY, JSON.stringify({answers, currentIdx, submitted})); } };
    window.move = (s) => { let n = currentIdx + s; if(n>=0 && n<bank.length) { currentIdx = n; render(); } };
    window.reveal = () => { revealed[currentIdx] = true; render(); };
    window.submitExam = () => { if(confirm("確定交卷？")) { submitted = true; render(); document.getElementById("resultBox").style.display="block"; } };

    init();
})();
</script>
</body>
</html>
