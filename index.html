<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>iPAS AI 應用規劃師隨身測驗</title>
  <style>
    :root { --bg:#0b1220; --card:#121a2a; --muted:#94a3b8; --text:#e5e7eb; --brand:#14b8a6; --danger:#ef4444; --ok:#22c55e; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:linear-gradient(180deg,#071023,#0b1220 40%); color:var(--text); min-height: 100vh; }
    .wrap{ max-width:1100px; margin:0 auto; padding:16px; }
    .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; }
    .brand{ font-weight:900; letter-spacing:.5px; font-size: 1.2rem; }
    .pill{ font-size:12px; color:#b6c2d6; background:rgba(148,163,184,.12); border:1px solid rgba(148,163,184,.22); padding:6px 10px; border-radius:999px; display:inline-flex; gap:8px; align-items:center; }
    .card{ background:rgba(18,26,42,.92); border:1px solid rgba(148,163,184,.18); border-radius:16px; padding:20px; box-shadow: 0 10px 30px rgba(0,0,0,.28); margin-bottom: 12px;}
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .grid{ display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width: 920px){ .grid{ grid-template-columns: 1.4fr .6fr; } }
    .muted{ color:var(--muted); font-size: 0.9rem; }
    .kbd{ font-family: ui-monospace, monospace; font-size:12px; padding:2px 6px; border-radius:8px; border:1px solid rgba(148,163,184,.25); background:rgba(2,6,23,.35); color:#d6dee9; }
    .btn{ appearance:none; border:0; border-radius:12px; padding:10px 16px; cursor:pointer; background:rgba(20,184,166,0.14); color:#c7fff6; border:1px solid rgba(20,184,166,0.45); font-weight:800; transition: 0.2s; }
    .btn:hover:not(:disabled){ background:var(--brand); color:white; }
    .btn:disabled{ opacity: 0.3; cursor: not-allowed; }
    .btn2{ background:rgba(148,163,184,0.12); border:1px solid rgba(148,163,184,0.28); color:#e5e7eb; }
    .btnDanger{ background:rgba(239,68,68,0.14); border:1px solid rgba(239,68,68,0.45); color:#ffd2d2; }
    .btnOk{ background:rgba(34,197,94,0.12); border:1px solid rgba(34,197,94,0.45); color:#d6ffe2; }
    .btn-active { background:var(--brand) !important; color:white !important; border-color:white !important; }
    .progress{ height:8px; background:rgba(148,163,184,0.14); border-radius:999px; overflow:hidden; }
    .bar{ height:100%; width:0%; background:linear-gradient(90deg, #14b8a6, #22c55e); transition: 0.4s cubic-bezier(0.1, 0.7, 0.1, 1); }
    .opt{ width:100%; text-align:left; padding:16px; border-radius:14px; border:1px solid rgba(148,163,184,0.22); background:rgba(2,6,23,0.35); color:var(--text); cursor:pointer; font-size:1.05rem; margin-bottom:12px; line-height: 1.5; transition: 0.2s; }
    .opt:hover:not(.correct):not(.wrong){ border-color: var(--brand); background: rgba(20,184,166,0.05); }
    .opt.selected{ outline:2px solid var(--brand); background: rgba(20,184,166,0.1); }
    .opt.correct{ border-color:var(--ok); background:rgba(34,197,94,0.15); color:#d6ffe2; font-weight: bold; }
    .opt.wrong{ border-color:var(--danger); background:rgba(239,68,68,0.15); color:#ffd2d2; }
    .miniGrid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(35px, 1fr)); gap:6px; }
    .qdot{ border-radius:8px; padding:8px 0; text-align:center; font-size:11px; border:1px solid rgba(148,163,184,0.22); cursor:pointer; background: rgba(2,6,23,0.2); }
    .qdot.active{ outline:2px solid var(--brand); background: var(--brand); color: white; }
    .qdot.ok{ border-color:var(--brand); color: var(--brand); }
    .qdot.right{ background:rgba(34,197,94,0.2); border-color:var(--ok); color:var(--ok); }
    .qdot.bad{ background:rgba(239,68,68,0.2); border-color:var(--danger); color:var(--danger); }
    .exp-box { margin-top:20px; padding:15px; background:rgba(20,184,166,0.1); border-radius:10px; border-left:4px solid var(--brand); animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div><div class="brand">iPAS AI 測驗系統</div></div>
      <div class="pill">
        <span id="modeStatus">讀取中...</span>
        <span class="kbd" id="timerDisplay">--:--</span>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <div class="row" style="justify-content:space-between; margin-bottom:20px;">
          <div class="row">
            <button class="btn2 btn" id="libAll" onclick="switchLib('./ipas_questions_all.json')">全部題庫</button>
            <button class="btn2 btn" id="libAi" onclick="switchLib('./ipas_questions_ai.json')">AI 規劃師</button>
          </div>
          <button class="btnDanger btn" onclick="clearProgress()">重置進度</button>
        </div>
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="row" style="justify-content:space-between; margin:10px 0 20px;">
          <div class="muted" id="progressText">0 / 0</div>
          <div class="muted" id="scoreDisplay">載入中...</div>
        </div>
        <div id="quizArea"></div>
        <div class="row" style="margin-top:25px; justify-content:space-between;">
          <button class="btn2 btn" onclick="move(-1)">上一題</button>
          <div class="row">
            <button class="btn2 btn" id="btnReveal" onclick="reveal()">看答案</button>
            <button class="btnOk btn" id="btnSubmit" onclick="submitExam()">送出交卷</button>
            <button class="btn" onclick="move(1)">下一題</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div style="font-weight:900; margin-bottom:12px;">測驗模式</div>
        <div class="row">
          <button class="btn2 btn" id="modeBtnPractice" onclick="switchMode('practice')">練習模式</button>
          <button class="btn2 btn" id="modeBtnExam" onclick="switchMode('exam')">考試模式</button>
        </div>
        <div style="height:1px; background:rgba(148,163,184,0.18); margin:15px 0;"></div>
        <div style="margin-bottom: 10px; font-weight: bold;">題號跳轉</div>
        <div id="navGrid" class="miniGrid"></div>
        <div id="resultBox" style="display:none; margin-top:20px; text-align:center;">
            <div id="finalScore" style="padding:15px; border-radius:12px; background:rgba(2,6,23,0.5); font-size:24px; font-weight:900;">總分：0</div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
    let libUrl = localStorage.getItem("ipas_active_url") || "./ipas_questions_ai.json";
    const LS_STATE_KEY = "ipas_save_" + libUrl;
    const LS_QUESTIONS_KEY = "ipas_questions_data_" + libUrl; // 儲存固定題目順序

    let bank = [], currentIdx = 0, answers = {}, revealed = {}, submitted = false;
    let mode = localStorage.getItem("quiz_mode") || "practice";
    let timeLeft = parseInt(localStorage.getItem("exam_time")) || 5400;
    let timerInterval = null;

    window.switchLib = (url) => { localStorage.setItem("ipas_active_url", url); location.reload(); };
    
    window.clearProgress = () => { 
        if(confirm("確定要重置所有進度、重新抽題嗎？")){ 
            localStorage.removeItem(LS_STATE_KEY); 
            localStorage.removeItem(LS_QUESTIONS_KEY);
            localStorage.removeItem("exam_time"); 
            location.reload(); 
        }
    };

    window.switchMode = (newMode) => {
        if(submitted) return alert("已交卷無法切換模式");
        mode = newMode;
        localStorage.setItem("quiz_mode", mode);
        location.reload();
    };

    async function init() {
        document.getElementById(libUrl.includes("ai")?"libAi":"libAll").classList.add("btn-active");
        document.getElementById(mode==="exam"?"modeBtnExam":"modeBtnPractice").classList.add("btn-active");
        document.getElementById("modeStatus").textContent = mode === "exam" ? "考試模式" : "練習模式";
        
        try {
            // 優先讀取暫存的題目順序，防止 reload 後題目亂跳
            const cachedBank = localStorage.getItem(LS_QUESTIONS_KEY);
            if (cachedBank) {
                bank = JSON.parse(cachedBank);
            } else {
                const res = await fetch(libUrl + "?v=" + Date.now());
                const data = await res.json();
                // 整理資料格式並隨機排序（只在第一次載入或重置後執行）
                bank = data.map((q,i)=>({ 
                    id:q.id||(i+1), 
                    title:q.q||q.question, 
                    opts:q.a||q.options, 
                    ans:(typeof q.c==='number'?q.c-1:q.c),
                    exp:q.e || "" // 解析欄位
                })).sort(()=>Math.random()-0.5);
                localStorage.setItem(LS_QUESTIONS_KEY, JSON.stringify(bank));
            }
            
            const saved = JSON.parse(localStorage.getItem(LS_STATE_KEY) || "{}");
            answers = saved.answers || {};
            currentIdx = saved.currentIdx || 0;
            submitted = saved.submitted || false;

            if(mode === "exam" && !submitted) startTimer();
            if(submitted) { 
                document.getElementById("btnSubmit").disabled = true; 
                document.getElementById("resultBox").style.display="block"; 
            }
            render();
        } catch(e) { 
            document.getElementById("quizArea").innerHTML = "題庫載入失敗，請確認 JSON 檔案路徑與格式。"; 
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if(timeLeft <= 0) { clearInterval(timerInterval); submitExam(true); return; }
            timeLeft--;
            localStorage.setItem("exam_time", timeLeft);
            const m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById("timerDisplay").textContent = `${m}:${s<10?'0':''}${s}`;
        }, 1000);
    }

    function render() {
        const q = bank[currentIdx];
        if(!q) return;
        const isRev = (mode === "practice" && revealed[currentIdx]) || submitted;
        document.getElementById("btnReveal").disabled = (mode === "exam" && !submitted);

        // 題目顯示
        let html = `<div style="font-size:1.25rem; font-weight:900; margin-bottom:20px; line-height:1.4;">${currentIdx+1}. <span class="kbd">ID:${q.id}</span> ${q.title}</div>`;
        
        // 選項按鈕
        q.opts.forEach((opt, i) => {
            let cls = "opt";
            if(answers[currentIdx] === i) cls += " selected";
            if(isRev) {
                if(i === q.ans) cls += " correct";
                else if(answers[currentIdx] === i) cls += " wrong";
            }
            html += `<button class="${cls}" onclick="choose(${i})">${opt}</button>`;
        });

        // 解析區塊顯示
        if (isRev && q.exp) {
            html += `<div class="exp-box"><strong>💡 解題分析：</strong><br><div style="margin-top:8px;">${q.exp}</div></div>`;
        }

        document.getElementById("quizArea").innerHTML = html;
        document.getElementById("bar").style.width = ((currentIdx+1)/bank.length*100) + "%";
        document.getElementById("progressText").textContent = `${currentIdx+1} / ${bank.length}`;
        
        renderNav();
        updateScore();
        localStorage.setItem(LS_STATE_KEY, JSON.stringify({ answers, currentIdx, submitted }));
    }

    function renderNav() {
        const nav = document.getElementById("navGrid");
        nav.innerHTML = bank.map((q, i) => {
            let cls = "qdot";
            if(i === currentIdx) cls += " active";
            if(submitted) {
                if(answers[i] === q.ans) cls += " right";
                else if(answers[i] !== undefined) cls += " bad";
            } else if(answers[i] !== undefined) cls += " ok";
            return `<div class="${cls}" onclick="go(${i})">${i+1}</div>`;
        }).join('');
    }

    function updateScore() {
        let correct = bank.filter((q,i) => answers[i] === q.ans).length;
        let total = bank.length;
        let score = Math.round((correct / total) * 100);
        if(submitted) {
            document.getElementById("finalScore").textContent = `總分：${score}`;
            document.getElementById("finalScore").style.color = score >= 70 ? "var(--ok)" : "var(--danger)";
        } else {
            document.getElementById("scoreDisplay").textContent = `已作答：${Object.keys(answers).length} 題`;
        }
    }

    window.choose = (i) => { if(!submitted) { answers[currentIdx] = i; render(); } };
    window.go = (i) => { currentIdx = i; render(); };
    window.move = (s) => { let n = currentIdx + s; if(n>=0 && n<bank.length) { currentIdx = n; render(); } };
    window.reveal = () => { revealed[currentIdx] = true; render(); };
    
    window.submitExam = (isAuto = false) => {
        if(submitted) return;
        if(isAuto || confirm("確定要交卷嗎？送出後將顯示正確答案與解析。")) {
            submitted = true; 
            clearInterval(timerInterval);
            localStorage.setItem(LS_STATE_KEY, JSON.stringify({ answers, currentIdx, submitted }));
            render();
            document.getElementById("btnSubmit").disabled = true;
            document.getElementById("resultBox").style.display="block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    };

    init();
})();
</script>
</body>
</html>
