<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>JSON 損壞精準定位工具</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #00ff00; padding: 20px; line-height: 1.5; }
        .error-card { background: #330000; border: 1px solid #ff0000; padding: 15px; margin-bottom: 20px; color: #ff9999; }
        .success { color: #00ff00; font-size: 1.2rem; }
        .info { color: #888; margin-bottom: 10px; }
        b { color: #fff; text-decoration: underline; }
    </style>
</head>
<body>
    <h2>🔍 JSON 檔案掃描中...</h2>
    <div id="output"></div>

<script>
async function scanJSON(fileName) {
    const output = document.getElementById('output');
    try {
        const res = await fetch(fileName + "?t=" + Date.now());
        if (!res.ok) throw new Error("找不到檔案：" + fileName);
        const text = await res.text();
        const lines = text.split('\n');
        
        output.innerHTML += `<div class="info">檔案讀取成功，共 $\{lines.length\} 行。開始逐行檢測...</div>`;

        // 嘗試整體解析，如果失敗才進入逐行檢查
        try {
            JSON.parse(text);
            output.innerHTML += `<div class="success">🎉 恭喜！檔案結構完全正確，沒有語法錯誤。</div>`;
        } catch (e) {
            const errorMsg = e.message;
            // 找出錯誤發生的位置（例如：at position 258926）
            const posMatch = errorMsg.match(/position (\d+)/);
            
            if (posMatch) {
                const pos = parseInt(posMatch[1]);
                const errorChar = text.substring(pos - 50, pos + 50);
                const lineNum = text.substring(0, pos).split('\n').length;

                let html = `<div class="error-card">`;
                html += `<h3>❌ 發現錯誤！</h3>`;
                html += `<p><b>錯誤訊息：</b>$\{errorMsg\}</p>`;
                html += `<p><b>概略行號：</b>約第 $\{lineNum\} 行</p>`;
                html += `<p><b>錯誤附近文字：</b><br><pre>...$\{escapeHTML(errorChar)\}...</pre></p>`;
                html += `<p style="color:#fff">💡 提示：請檢查第 $\{lineNum\} 行結尾是否漏了逗號 <b>,</b> 或者括號 <b>}</b> 是否沒寫對。</p>`;
                html += `</div>`;
                output.innerHTML += html;
            } else {
                output.innerHTML += `<div class="error-card">無法自動定位位置，錯誤訊息：$\{errorMsg\}</div>`;
            }
        }
    } catch (err) {
        output.innerHTML += `<div style="color:red">讀取失敗：$\{err.message\}</div>`;
    }
}

function escapeHTML(str) {
    return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
}

// 執行檢測（您可以改名測試不同的檔案）
scanJSON('ipas_questions_ai.json');
</script>
</body>
</html>
