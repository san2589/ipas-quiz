<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>iPAS 模擬考 - 功能修復版</title>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --brand:#2dd4bf; --text:#f1f5f9; }
        body { background:var(--bg); color:var(--text); font-family: sans-serif; margin:0; padding:20px; line-height:1.6; }
        .wrap { max-width:800px; margin:0 auto; }
        .card { background:var(--card); padding:20px; border-radius:12px; border:1px solid #334155; margin-bottom:15px; }
        .btn { background:#334155; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; margin-right:8px; }
        .btn-active { background:var(--brand) !important; color:#0f172a !important; }
        .opt { width:100%; text-align:left; padding:15px; background:#0f172a; border:1px solid #334155; color:white; border-radius:8px; margin-bottom:10px; cursor:pointer; font-size:16px; display: block; }
        .opt.selected { border-color:var(--brand); background:rgba(45,212,191,0.1); }
        .opt.correct { background:rgba(34,197,94,0.3) !important; border-color:#22c55e !important; }
        .opt.wrong { background:rgba(251,113,133,0.3) !important; border-color:#fb7185 !important; }
        .nav-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap:8px; margin-top:10px; }
        .dot { background:#0f172a; border:1px solid #334155; text-align:center; padding:8px 0; border-radius:5px; cursor:pointer; font-size:12px; }
        .dot.active { border-color:var(--brand); color:var(--brand); font-weight:bold; }
        .dot.done { background:#475569; color:#fff; }
        .exp-box { padding:15px; background:rgba(45,212,191,0.1); border-left:4px solid var(--brand); margin-top:15px; border-radius:4px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h2 style="color:var(--brand); margin-top:0;">iPAS 模擬考系統</h2>
        <button class="btn" id="btnAi" onclick="fetchAndParse('ipas_questions_ai.json')">載入 AI 規劃師</button>
        <button class="btn" id="btnAll" onclick="fetchAndParse('ipas_questions_all.json')">載入全部題庫</button>
        <div id="status" style="margin-top:10px; font-size:14px; color:#94a3b8;">狀態：待命</div>
    </div>
    <div id="quizBox" style="display:none;">
        <div class="card">
            <div id="qArea"></div>
            <div style="display:flex; justify-content:space-between; margin-top:20px;">
                <button class="btn" onclick="move(-1)">上一題</button>
                <button class="btn" onclick="revealExp()">看解析</button>
                <button class="btn" onclick="move(1)">下一題</button>
            </div>
        </div>
        <div class="card"><div id="navGrid" class="nav-grid"></div></div>
    </div>
</div>

<script>
let bank = [], current = 0, answers = {}, revealed = {};

async function fetchAndParse(name) {
    document.getElementById('status').textContent = "讀取並解析中...";
    try {
        const res = await fetch(name + "?v=" + Date.now());
        const text = await res.text();
        
        // 1. 先用大括號把題目切開
        const blocks = text.split(/\{(?=\s*"(?:id|q|question)")/);
        let temp = [];

        blocks.forEach(block => {
            // 抓取引號內的文字 (處理轉義引號 \")
            const find = (key) => {
                const r = new RegExp(`"${key}"\\s*:\\s*"([\\s\\S]*?)"(?=[\\s\\n]*,|[\\s\\n]*\\})`);
                const m = block.match(r);
                return m ? m[1].replace(/\\"/g, '"').trim() : null;
            };

            let q = find("question") || find("q");
            if (!q) return;

            let item = { q: q, opts: [], ans: -1, exp: find("analysis") || find("e") || "無解析" };

            // 處理 AI 版選項
            if (block.includes('"options"')) {
                const optA = find("A");
                const optB = find("B");
                const optC = find("C");
                const optD = find("D");
                if (optA) item.opts = [optA, optB, optC, optD];
                const letterMap = {"A":0, "B":1, "C":2, "D":3};
                const rawAns = find("answer");
                item.ans = letterMap[rawAns];
            } 
            // 處理 ALL 版選項
            else {
                const aMatch = block.match(/"a"\s*:\s*\[([\s\S]*?)\]/);
                if (aMatch) {
                    item.opts = aMatch[1].split(/",|"/).map(s => s.trim().replace(/[\[\]"]/g, '')).filter(s => s.length > 0);
                }
                const cMatch = block.match(/"c"\s*:\s*"?(\d)"?/);
                if (cMatch) item.ans = parseInt(cMatch[1]) - 1;
            }

            if (item.q && item.opts.length >= 2) temp.push(item);
        });

        bank = temp.sort(() => Math.random() - 0.5).slice(0, 50);
        current = 0; answers = {}; revealed = {};
        document.getElementById('quizBox').style.display = "block";
        document.getElementById('status').textContent = "✅ 成功載入 " + temp.length + " 題，已隨機抽取 50 題。";
        render();
    } catch (e) {
        document.getElementById('status').textContent = "❌ 讀取失敗: " + e.message;
    }
}

function render() {
    const item = bank[current];
    const isRevealed = revealed[current];
    let html = `<h3>Q${current + 1}. ${item.q}</h3>`;

    item.opts.forEach((opt, i) => {
        let cls = "opt";
        if (answers[current] === i) cls += " selected";
        if (isRevealed) {
            if (i === item.ans) cls += " correct";
            else if (answers[current] === i) cls += " wrong";
        }
        html += `<button class="${cls}" onclick="selectOpt(${i})">${opt}</button>`;
    });

    if (isRevealed) {
        html += `<div class="exp-box"><b>💡 解析：</b><br>${item.exp}</div>`;
    }

    document.getElementById('qArea').innerHTML = html;
    
    // 更新題號網格
    document.getElementById('navGrid').innerHTML = bank.map((_, i) => {
        let cls = "dot" + (i === current ? " active" : (answers[i] !== undefined ? " done" : ""));
        return `<div class="${cls}" onclick="gotoQ(${i})">${i + 1}</div>`;
    }).join('');
}

function selectOpt(index) {
    if (revealed[current]) return; // 已看解析就不准再選
    answers[current] = index;
    render();
}

function revealExp() {
    revealed[current] = true;
    render();
}

function gotoQ(index) {
    current = index;
    render();
}

function move(step) {
    let next = current + step;
    if (next >= 0 && next < bank.length) {
        current = next;
        render();
    }
}
</script>
</body>
</html>
