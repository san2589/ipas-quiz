<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="iPAS 測驗 Web App" />
  <title>iPAS 測驗</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.png" />

  <style>
    :root { --bg:#0b1220; --card:#121a2a; --muted:#94a3b8; --text:#e5e7eb; --brand:#14b8a6; --danger:#ef4444; --ok:#22c55e; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial;
          background:linear-gradient(180deg,#071023,#0b1220 40%); color:var(--text); }
    .wrap{ max-width:1100px; margin:0 auto; padding:16px; }
    .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; }
    .brand{ font-weight:900; letter-spacing:.5px; }
    .pill{ font-size:12px; color:#b6c2d6; background:rgba(148,163,184,.12); border:1px solid rgba(148,163,184,.22);
          padding:6px 10px; border-radius:999px; display:inline-flex; gap:8px; align-items:center; }
    .card{ background:rgba(18,26,42,.92); border:1px solid rgba(148,163,184,.18);
          border-radius:16px; padding:16px; box-shadow: 0 10px 30px rgba(0,0,0,.28); }
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .grid{ display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width: 920px){ .grid{ grid-template-columns: 1.25fr .75fr; } }

    .muted{ color:var(--muted); }
    .kbd{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
          font-size:12px; padding:2px 6px; border-radius:8px; border:1px solid rgba(148,163,184,.25); background:rgba(2,6,23,.35); color:#d6dee9; }
    .btn{ appearance:none; border:0; border-radius:12px; padding:10px 12px; cursor:pointer;
          background:rgba(20,184,166,.14); color:#c7fff6; border:1px solid rgba(20,184,166,.45); font-weight:800; }
    .btn:hover{ filter:brightness(1.05); }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }
    .btn2{ background:rgba(148,163,184,.12); border:1px solid rgba(148,163,184,.28); color:#e5e7eb; font-weight:800; }
    .btnDanger{ background:rgba(239,68,68,.14); border:1px solid rgba(239,68,68,.45); color:#ffd2d2; font-weight:900; }
    .btnOk{ background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.45); color:#d6ffe2; font-weight:900; }

    .progress{ height:10px; background:rgba(148,163,184,.14); border-radius:999px; overflow:hidden; border:1px solid rgba(148,163,184,.18); }
    .bar{ height:100%; width:0%; background:linear-gradient(90deg, rgba(20,184,166,.85), rgba(34,197,94,.85)); }

    .opt{
      width:100%;
      text-align:left;
      padding:14px 14px;
      border-radius:14px;
      border:1px solid rgba(148,163,184,.22);
      background:rgba(2,6,23,.35);
      color:var(--text);
      cursor:pointer;
      font-size:clamp(18px, 4.6vw, 20px);
      line-height:1.6;
    }

    .opt:hover{ border-color:rgba(20,184,166,.6); }
    .opt.selected{ outline:2px solid rgba(20,184,166,.8); border-color:rgba(20,184,166,.8); }
    .opt.correct{ outline:2px solid rgba(34,197,94,.85); border-color:rgba(34,197,94,.85); }
    .opt.wrong{ outline:2px solid rgba(239,68,68,.9); border-color:rgba(239,68,68,.9); }

    .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:16px; padding:10px 12px;
            background:rgba(2,6,23,.82); border:1px solid rgba(148,163,184,.25); border-radius:12px; color:#e5e7eb;
            max-width: 92vw; box-shadow: 0 10px 30px rgba(0,0,0,.35); display:none; z-index:9998; }

    .divider{ height:1px; background:rgba(148,163,184,.18); margin:12px 0; }

    .miniGrid{ display:grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap:6px; }
    @media (max-width: 520px){ .miniGrid{ grid-template-columns: repeat(8, minmax(0, 1fr)); } }
    .qdot{
      border-radius:10px; padding:6px 0; text-align:center; font-size:12px;
      border:1px solid rgba(148,163,184,.22); background:rgba(2,6,23,.35); color:#d6dee9;
      cursor:pointer; user-select:none;
    }
    .qdot.active{ outline:2px solid rgba(20,184,166,.7); }
    .qdot.ok{ border-color: rgba(34,197,94,.6); background: rgba(34,197,94,.10); color:#d6ffe2; }
    .qdot.bad{ border-color: rgba(239,68,68,.7); background: rgba(239,68,68,.10); color:#ffd2d2; }
    .qdot.na{ border-color: rgba(148,163,184,.28); background: rgba(148,163,184,.10); color:#d6dee9; opacity:.9; }
    
    /* 選擇器樣式 */
    .quiz-select { background:#1e293b; color:#fff; border:1px solid #334155; border-radius:8px; padding:4px 8px; font-size:13px; }
  </style>
</head>

<div id="fatal" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;
background:#2b0b0b;color:#ffd9d9;border:1px solid #ff6b6b;border-radius:12px;padding:10px;
font:12px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial;white-space:pre-wrap;">
</div>

<script>
(function(){
  var box = document.getElementById('fatal');
  function show(msg){
    if(!box) return;
    box.style.display = 'block';
    box.textContent = msg;
  }
  window.addEventListener('error', function(e){
    var msg = "JS Error:\n" + (e && e.message ? e.message : String(e)) + "\n" + (e && e.filename ? e.filename : "") + ":" + (e && e.lineno ? e.lineno : "");
    show(msg);
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = (e && e.reason) ? e.reason : e;
    show("Promise Rejection:\n" + ((r && r.message) ? r.message : String(r)));
  });
})();
</script>

<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">iPAS 測驗</div>
        <div class="muted" style="font-size:12px;">一次到位版：成績分析 + 考試倒數 + 錯題本</div>
      </div>
      <div class="pill" id="statusPill">
        <span id="statusText">初始化中…</span>
        <span class="kbd" id="timerText" style="display:none;">--:--</span>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="row" style="align-items:center; justify-content:space-between;">
          <div class="muted" style="font-size:13px;">
            題庫：
            <select id="quizSelector" class="quiz-select">
                <option value="./ipas_questions_all.json">全部題庫 (All)</option>
                <option value="./ipas_questions_ai.json">AI 應用規劃師 (AI)</option>
            </select>
            <span style="margin-left:8px;">版本：<span class="kbd" id="appVer"></span></span>
            <span style="margin-left:8px;">本回合：<span class="kbd" id="sessionText">一般</span></span>
          </div>
          <div class="row">
            <button class="btn2 btn" id="btnRetry" style="display:none;">重新載入題庫</button>
            <button class="btnDanger btn" id="btnReset">清除進度</button>
          </div>
        </div>

        <div style="margin:12px 0;">
          <div class="progress"><div class="bar" id="bar"></div></div>
          <div class="row" style="justify-content:space-between; margin-top:8px;">
            <div class="muted" id="progressText">0 / 0</div>
            <div class="muted" id="scoreText">正確 0・錯誤 0・未作答 0</div>
          </div>
        </div>

        <div id="questionArea" style="margin-top:10px;">
          <div class="muted">載入題庫中…</div>
        </div>

        <div class="row" style="margin-top:14px; justify-content:space-between;">
          <button class="btn2 btn" id="btnPrev" disabled>上一題</button>
          <div class="row">
            <button class="btn2 btn" id="btnReveal" disabled>看答案</button>
            <button class="btn2 btn" id="btnSubmit" disabled>交卷</button>
            <button class="btn" id="btnNext" disabled>下一題</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div style="font-weight:900; margin-bottom:10px;">設定 / 工具</div>
        <label class="muted">模式</label>
        <div class="row">
          <button class="btn2 btn" id="modePractice">練習模式</button>
          <button class="btn2 btn" id="modeExam">考試模式</button>
        </div>
        <div class="row" style="margin-top:10px; align-items:center;">
          <span class="muted">考試時間：</span>
          <button class="btn2 btn" id="btnT60">60 分</button>
          <button class="btn2 btn" id="btnT90">90 分</button>
          <button class="btn2 btn" id="btnT120">120 分</button>
        </div>
        <div class="divider"></div>
        <label class="muted">題目順序</label>
        <div class="row"><button class="btn2 btn" id="btnShuffle">隨機洗牌</button><button class="btn2 btn" id="btnOrdered">照原順序</button></div>
        <div class="divider"></div>
        <label class="muted">錯題本</label>
        <div class="row"><button class="btnOk btn" id="btnStartWrong">重測錯題</button><button class="btn2 btn" id="btnClearWrong">清除錯題本</button></div>
        <div class="divider"></div>
        <label class="muted">成績分析</label>
        <div class="row"><button class="btn2 btn" id="btnShowAll">全部</button><button class="btn2 btn" id="btnShowWrong">只看錯題</button><button class="btn2 btn" id="btnShowUnanswered">只看未作答</button></div>
        <div id="navGrid" class="miniGrid" style="margin-top:10px;"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
(() => {
  // ========= Config =========
  const APP_VERSION = "1.0.1-fixed";
  // 關鍵：從 localStorage 讀取上次選擇的檔案，沒選過才用 ai
  let QUESTIONS_URL = localStorage.getItem("ipas_active_url") || "./ipas_questions_ai.json";
  const PICK_COUNT = 50;
  const POINT_PER_Q = 2;
  const PASS_SCORE = 70;
  const FETCH_TIMEOUT_MS = 12000;

  const LS_STATE = "ipas_quiz_state_v1";
  const LS_QCACHE = "ipas_questions_cache_v1";
  const LS_LAST_SCORE = "ipas_last_score_v1";
  const LS_WRONG = "ipas_wrongbook_v1";
  const LS_DRAW_NORMAL = "ipas_draw_normal_v1";
  const LS_DRAW_WRONG  = "ipas_draw_wrong_v1";

  // ========= DOM =========
  const elStatusPill = document.getElementById("statusPill");
  const elStatusText = document.getElementById("statusText");
  const elTimerText = document.getElementById("timerText");
  const elQuizSelector = document.getElementById("quizSelector");
  const elAppVer = document.getElementById("appVer");
  const elSessionText = document.getElementById("sessionText");
  const elBar = document.getElementById("bar");
  const elProgress = document.getElementById("progressText");
  const elScore = document.getElementById("scoreText");
  const elArea = document.getElementById("questionArea");
  const elToast = document.getElementById("toast");
  const elNav = document.getElementById("navGrid");

  const btnPrev = document.getElementById("btnPrev"), btnNext = document.getElementById("btnNext");
  const btnReveal = document.getElementById("btnReveal"), btnSubmit = document.getElementById("btnSubmit");
  const btnReset = document.getElementById("btnReset"), btnRetry = document.getElementById("btnRetry");
  const btnShuffle = document.getElementById("btnShuffle"), btnOrdered = document.getElementById("btnOrdered");
  const modePractice = document.getElementById("modePractice"), modeExam = document.getElementById("modeExam");
  const btnT60 = document.getElementById("btnT60"), btnT90 = document.getElementById("btnT90"), btnT120 = document.getElementById("btnT120");
  const btnStartWrong = document.getElementById("btnStartWrong"), btnClearWrong = document.getElementById("btnClearWrong");
  const btnShowAll = document.getElementById("btnShowAll"), btnShowWrong = document.getElementById("btnShowWrong"), btnShowUnanswered = document.getElementById("btnShowUnanswered");

  elQuizSelector.value = QUESTIONS_URL;
  elAppVer.textContent = APP_VERSION;

  // ========= State =========
  const defaultState = () => ({
    version: APP_VERSION, mode: "exam", order: "ordered", seed: null, idx: 0,
    answers: {}, reveal: {}, submitted: false, examDurationSec: 90 * 60,
    examStartAt: null, session: "normal", filter: "all"
  });

  let state = loadState();
  let bank = [], questions = [], viewOrder = [], bankSize = 0, timerHandle = null;

  function loadState(){
    try{ const raw = localStorage.getItem(LS_STATE); return raw ? { ...defaultState(), ...JSON.parse(raw) } : defaultState(); } catch{ return defaultState(); }
  }
  function saveState(){ localStorage.setItem(LS_STATE, JSON.stringify(state)); }

  function toast(msg){
    elToast.textContent = msg; elToast.style.display = "block";
    clearTimeout(toast._t); toast._t = setTimeout(()=> elToast.style.display="none", 2000);
  }

  function setStatus(text, kind){
    elStatusText.textContent = text;
    if(kind === "ok") { elStatusPill.style.borderColor = "rgba(34,197,94,.45)"; elStatusPill.style.color = "#d6ffe2"; }
    else if(kind === "err") { elStatusPill.style.borderColor = "rgba(239,68,68,.45)"; elStatusPill.style.color = "#ffd2d2"; }
  }

  async function fetchQuestions(){
    const res = await fetch(QUESTIONS_URL + "?v=" + Date.now(), { cache:"no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    localStorage.setItem(LS_QCACHE + QUESTIONS_URL, JSON.stringify({ savedAt: Date.now(), data }));
    return data;
  }

  function loadCachedQuestions(){
    try{ const raw = localStorage.getItem(LS_QCACHE + QUESTIONS_URL); return raw ? JSON.parse(raw).data : null; } catch{ return null; }
  }

  function normalizeQuestions(raw){
    return raw.map((q, i) => {
      const id = q.id ?? q.qid ?? q.no ?? (i + 1);
      let title = (q.q ?? q.question ?? "").toString().replace(/^\s*\d+\s*[.)、．]\s*/, "");
      const options = q.a ?? q.options ?? [];
      let ansIndex = null;
      const ansRaw = q.c ?? q.answer;
      if(typeof ansRaw === "number") ansIndex = (ansRaw >= 1) ? ansRaw - 1 : ansRaw;
      else if(typeof ansRaw === "string") {
          const n = parseInt(ansRaw);
          ansIndex = isNaN(n) ? ansRaw.trim().toUpperCase().charCodeAt(0) - 65 : n - 1;
      }
      return { id, title, options, ansIndex };
    });
  }

  function buildViewOrder(){
    const n = questions.length; const arr = [...Array(n).keys()];
    if(state.order === "shuffled"){
      let seed = state.seed || (state.seed = Date.now() >>> 0);
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      for(let i = arr.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    }
    viewOrder = arr;
    state.idx = Math.min(Math.max(0, state.idx), viewOrder.length - 1);
    saveState();
  }

  function render(){
    const q = questions[viewOrder[state.idx]];
    updateTop();
    if(!q) { elArea.innerHTML = "題庫載入中..."; return; }
    
    const chosen = state.answers[q.id], isRevealed = !!state.reveal[q.id], correct = q.ansIndex;
    const optHtml = q.options.map((text, i) => {
      let cls = "opt" + (chosen === i ? " selected" : "");
      if(isRevealed && correct !== null){ if(i === correct) cls += " correct"; else if(chosen === i) cls += " wrong"; }
      return `<button class="${cls}" onclick="onChoose(${i})"><div style="display:flex; gap:10px;"><div class="kbd">${String.fromCharCode(65+i)}</div><div>${text}</div></div></button>`;
    }).join("");

    elArea.innerHTML = `<div style="font-size:18px; font-weight:900;">[${q.id}] ${q.title}</div><div style="margin-top:12px; display:flex; flex-direction:column; gap:10px;">${optHtml}</div>`;
    btnPrev.disabled = state.idx === 0; btnNext.disabled = state.idx === questions.length - 1;
    btnReveal.disabled = state.mode !== "practice" && !state.submitted;
    buildNavGrid();
  }

  window.onChoose = (i) => { if(!state.submitted) { state.answers[questions[viewOrder[state.idx]].id] = i; saveState(); render(); } };

  function updateTop(){
    const total = questions.length;
    elProgress.textContent = `第 ${state.idx + 1} / ${total} 題`;
    elBar.style.width = total ? `${((state.idx+1)/total)*100}%` : "0%";
  }

  function buildNavGrid(){
    elNav.innerHTML = questions.map((q, i) => {
        const active = viewOrder[state.idx] === i;
        const ans = state.answers[q.id] !== undefined;
        return `<div class="qdot ${active?'active':''} ${ans?'ok':''}" onclick="jumpTo(${i})">${i+1}</div>`;
    }).join("");
  }
  window.jumpTo = (i) => { state.idx = viewOrder.indexOf(i); saveState(); render(); };

  // ========= 核心修正功能 =========
  elQuizSelector.onchange = (e) => {
    const newUrl = e.target.value;
    localStorage.setItem("ipas_active_url", newUrl);
    localStorage.removeItem(LS_DRAW_NORMAL); // 切換題庫須重新抽題
    location.reload();
  };

  btnReset.onclick = () => {
    if(confirm("確定要清除所有進度並重新開始嗎？")){
        localStorage.removeItem(LS_STATE);
        localStorage.removeItem(LS_DRAW_NORMAL);
        localStorage.removeItem(LS_DRAW_WRONG);
        // 注意：這裡不刪除 ipas_active_url，所以會停留在目前題庫
        location.reload();
    }
  };

  async function init(){
    try {
      setStatus("載入中...", "info");
      let raw;
      try { raw = await fetchQuestions(); setStatus("連線成功", "ok"); } 
      catch { raw = loadCachedQuestions(); if(raw) setStatus("離線模式", "ok"); else throw new Error("無網路且無快取"); }
      
      bank = normalizeQuestions(raw);
      // 簡單抽題邏輯
      let drawIds = JSON.parse(localStorage.getItem(LS_DRAW_NORMAL) || "[]");
      if(drawIds.length === 0) {
          drawIds = bank.map(q => q.id).sort(() => Math.random() - 0.5).slice(0, PICK_COUNT);
          localStorage.setItem(LS_DRAW_NORMAL, JSON.stringify(drawIds));
      }
      const map = new Map(bank.map(q => [q.id, q]));
      questions = drawIds.map(id => map.get(id)).filter(Boolean);
      buildViewOrder();
      render();
    } catch(e) { setStatus("錯誤", "err"); elArea.innerHTML = "載入失敗: " + e.message; }
  }

  btnPrev.onclick = () => { if(state.idx > 0) { state.idx--; saveState(); render(); } };
  btnNext.onclick = () => { if(state.idx < questions.length - 1) { state.idx++; saveState(); render(); } };
  btnReveal.onclick = () => { state.reveal[questions[viewOrder[state.idx]].id] = true; saveState(); render(); };
  btnSubmit.onclick = () => { state.submitted = true; saveState(); render(); toast("已交卷"); };
  btnShuffle.onclick = () => { state.order = "shuffled"; state.seed = Date.now(); buildViewOrder(); render(); };
  btnOrdered.onclick = () => { state.order = "ordered"; buildViewOrder(); render(); };
  
  init();
})();
</script>
</body>
</html>
