<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>iPAS 模擬考 - 究極修復版</title>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --brand:#2dd4bf; --text:#f1f5f9; }
        body { background:var(--bg); color:var(--text); font-family: sans-serif; margin:0; padding:20px; line-height:1.6; }
        .wrap { max-width:800px; margin:0 auto; }
        .card { background:var(--card); padding:20px; border-radius:12px; border:1px solid #334155; margin-bottom:15px; }
        .btn { background:#334155; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; margin-right:8px; }
        .opt { width:100%; text-align:left; padding:15px; background:#0f172a; border:1px solid #334155; color:white; border-radius:8px; margin-bottom:10px; cursor:pointer; }
        .opt.selected { border-color:var(--brand); background:rgba(45,212,191,0.1); }
        .opt.correct { background:rgba(34,197,94,0.2); border-color:#22c55e; }
        .opt.wrong { background:rgba(251,113,133,0.2); border-color:#fb7185; }
        .nav-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap:8px; margin-top:10px; }
        .dot { background:#0f172a; border:1px solid #334155; text-align:center; padding:8px 0; border-radius:5px; cursor:pointer; font-size:12px; color:#94a3b8; }
        .dot.active { border-color:var(--brand); color:var(--brand); font-weight:bold; }
        .dot.done { background:#334155; color:#fff; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h2 style="color:var(--brand); margin-top:0;">iPAS 模擬考系統</h2>
        <button class="btn" onclick="loadAndRepair('ipas_questions_ai.json')">載入 AI 規劃師</button>
        <button class="btn" onclick="loadAndRepair('ipas_questions_all.json')">載入全部題庫</button>
        <div id="status" style="margin-top:10px; font-size:14px; color:#94a3b8;">請點擊按鈕載入 JSON 檔案</div>
    </div>
    <div id="quizBox" style="display:none;">
        <div class="card">
            <div id="qArea"></div>
            <div style="display:flex; justify-content:space-between; margin-top:20px;">
                <button class="btn" onclick="move(-1)">上一題</button>
                <button class="btn" onclick="revealed[current]=true;render()">看解析</button>
                <button class="btn" onclick="move(1)">下一題</button>
            </div>
        </div>
        <div class="card"><div id="navGrid" class="nav-grid"></div></div>
    </div>
</div>

<script>
let bank = [], current = 0, answers = {}, revealed = {};

async function loadAndRepair(name) {
    document.getElementById('status').textContent = "正在強力修復並讀取中...";
    try {
        const res = await fetch(name + "?v=" + Date.now());
        const text = await res.text();
        
        // 使用「非標準 JSON」切割法，專治格式錯誤
        const rawBlocks = text.split(/\{\s*"id"/); 
        let temp = [];

        rawBlocks.forEach(block => {
            const getVal = (key) => {
                const reg = new RegExp(`"${key}"\\s*:\\s*"([\\s\\S]*?)"(?=[\\s\\n]*,|[\\s\\n]*\\})`);
                const m = block.match(reg);
                return m ? m[1].replace(/\\"/g, '"') : "";
            };

            let q = getVal("question") || getVal("q");
            if (!q) return;

            let ans = getVal("answer");
            let cVal = "";
            if (!ans) {
                const cMatch = block.match(/"c"\s*:\s*(\d)/);
                cVal = cMatch ? cMatch[1] : "";
            }

            let exp = getVal("analysis") || getVal("e");
            let opts = [];
            
            // 抓取選項
            ["A","B","C","D"].forEach(l => {
                let o = getVal(l);
                if (o) opts.push(o);
            });
            if (opts.length === 0) {
                const aMatch = block.match(/"a"\s*:\s*\[([\s\S]*?)\]/);
                if (aMatch) opts = aMatch[1].split('",').map(s => s.replace(/[\[\]" \n]/g, ''));
            }

            if (q && opts.length >= 2) {
                const lMap = {"A":0, "B":1, "C":2, "D":3};
                temp.push({
                    q: q,
                    opts: opts,
                    ans: ans ? lMap[ans] : (parseInt(cVal)-1),
                    exp: exp
                });
            }
        });

        bank = temp.sort(() => Math.random() - 0.5).slice(0, 50);
        current = 0; answers = {}; revealed = {};
        document.getElementById('quizBox').style.display = "block";
        document.getElementById('status').textContent = "✅ 讀取成功！已修正損壞區塊，共 " + temp.length + " 題。";
        render();
    } catch (e) {
        document.getElementById('status').textContent = "❌ 錯誤: " + e.message;
    }
}

function render() {
    const item = bank[current];
    let html = `<h3>Q${current+1}: ${item.q}</h3>`;
    item.opts.forEach((opt, i) => {
        let cls = "opt" + (answers[current] === i ? " selected" : "");
        if (revealed[current]) cls += (i === item.ans ? " correct" : (answers[current] === i ? " wrong" : ""));
        html += `<button class="${cls}" onclick="if(!revealed[current]){answers[current]=i;render()}">${opt}</button>`;
    });
    if (revealed[current]) html += `<div style="padding:15px; background:rgba(45,212,191,0.1); border-left:4px solid var(--brand); margin-top:10px;"><b>解析：</b>${item.exp}</div>`;
    document.getElementById('qArea').innerHTML = html;
    document.getElementById('navGrid').innerHTML = bank.map((_,i) => `<div class="dot ${i===current?'active':''} ${answers[i]!==undefined?'done':''}" onclick="current=${i};render()">${i+1}</div>`).join('');
}

function move(s) { let n = current + s; if(n>=0 && n<bank.length) { current=n; render(); } }
</script>
</body>
</html>
