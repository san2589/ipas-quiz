<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>iPAS 模擬考系統 - 檢討優化版</title>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --brand:#2dd4bf; --text:#f1f5f9; }
        body { background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, sans-serif; margin:0; padding:20px; line-height:1.6; }
        .wrap { max-width:800px; margin:0 auto; }
        .card { background:var(--card); padding:24px; border-radius:16px; border:1px solid #334155; margin-bottom:20px; }
        h2 { color:var(--brand); margin:0 0 15px 0; }
        .btn { background:#334155; color:white; border:none; padding:10px 18px; border-radius:10px; cursor:pointer; font-weight:bold; margin-right:8px; margin-bottom:8px; }
        .btn-active { background:var(--brand) !important; color:#0f172a !important; }
        .btn-primary { background:var(--brand); color:#0f172a; width: 100%; margin-top: 10px; font-size: 1.1rem; }
        .opt { width:100%; text-align:left; padding:16px; background:#0f172a; border:2px solid #334155; color:white; border-radius:12px; margin-bottom:12px; cursor:pointer; font-size:16px; display: block; }
        .opt.selected { border-color:var(--brand); background:rgba(45,212,191,0.1); }
        .opt.correct { background:rgba(34,197,94,0.3) !important; border-color:#22c55e !important; color:#4ade80; }
        .opt.wrong { background:rgba(251,113,133,0.3) !important; border-color:#fb7185 !important; color:#fda4af; }
        .nav-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap:8px; margin-top:15px; }
        .dot { background:#0f172a; border:1px solid #334155; text-align:center; padding:10px 0; border-radius:8px; cursor:pointer; font-size:12px; }
        .dot.active { border-color:var(--brand); color:var(--brand); box-shadow: 0 0 8px rgba(45,212,191,0.4); }
        /* 交卷後的顏色指標 */
        .dot.score-correct { background:#065f46 !important; border-color:#10b981 !important; color:white; }
        .dot.score-wrong { background:#7f1d1d !important; border-color:#ef4444 !important; color:white; }
        .dot.done { background:#475569; }
        .exp-box { padding:18px; background:rgba(45,212,191,0.05); border-left:4px solid var(--brand); margin-top:20px; border-radius:8px; }
        .result-header { text-align: center; padding: 20px; background: rgba(45,212,191,0.1); border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--brand); }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card" id="setupBox">
        <h2>iPAS 模擬考系統</h2>
        <button class="btn" onclick="fetchAndParse('ipas_questions_ai.json')">載入 AI 規劃師</button>
        <button class="btn" onclick="fetchAndParse('ipas_questions_all.json')">載入全部題庫</button>
        <div id="status" style="margin-top:10px; font-size:14px; color:#94a3b8;">請選擇題庫開始</div>
    </div>

    <div id="quizBox" style="display:none;">
        <div id="scoreBoard" class="result-header" style="display:none;">
            <div style="font-size: 1.2rem;">測驗結束</div>
            <div style="font-size: 2.5rem; font-weight: bold; color: var(--brand);" id="finalScoreText">0 分</div>
            <div id="scoreDetailText">答對 0 題 / 答錯 0 題</div>
            <button class="btn" style="margin-top:10px; background:var(--brand); color:#000;" onclick="location.reload()">重新測驗</button>
        </div>

        <div class="card">
            <div id="qArea"></div>
            <div style="display:flex; justify-content:space-between; margin-top:25px; gap:10px;">
                <button class="btn" style="flex:1" onclick="move(-1)">上一題</button>
                <button class="btn" style="flex:1" onclick="revealed[current]=true;render()">看解析</button>
                <button class="btn" style="flex:1" onclick="move(1)">下一題</button>
            </div>
            <button class="btn btn-primary" id="finishBtn" onclick="submitExam()">送出交卷</button>
        </div>

        <div class="card">
            <div style="margin-bottom:10px; font-weight:bold;">題目清單 (點擊可跳題檢討)</div>
            <div id="navGrid" class="nav-grid"></div>
        </div>
    </div>
</div>

<script>
let bank = [], current = 0, answers = {}, revealed = {}, isFinished = false;

async function fetchAndParse(name) {
    document.getElementById('status').textContent = "讀取中...";
    try {
        const res = await fetch(name + "?v=" + Date.now());
        const text = await res.text();
        const blocks = text.split(/\{(?=\s*"(?:id|q|question)")/);
        let temp = [];

        blocks.forEach(block => {
            const find = (key) => {
                const r = new RegExp(`"${key}"\\s*:\\s*"([\\s\\S]*?)"(?=[\\s\\n]*,|[\\s\\n]*\\})`);
                const m = block.match(r);
                return m ? m[1].replace(/\\"/g, '"').trim() : null;
            };
            let q = find("question") || find("q");
            if (!q) return;
            let item = { q: q, opts: [], ans: -1, exp: find("analysis") || find("e") || "無解析" };
            if (block.includes('"options"')) {
                item.opts = [find("A"), find("B"), find("C"), find("D")].filter(o => o !== null);
                item.ans = {"A":0,"B":1,"C":2,"D":3}[find("answer")];
            } else {
                const aM = block.match(/"a"\s*:\s*\[([\s\S]*?)\]/);
                if (aM) item.opts = aM[1].split(/",|"/).map(s => s.trim().replace(/[\[\]"]/g, '')).filter(s => s.length > 0);
                const cM = block.match(/"c"\s*:\s*"?(\d)"?/);
                if (cM) item.ans = parseInt(cM[1]) - 1;
            }
            if (item.q && item.opts.length >= 2 && item.ans !== undefined) temp.push(item);
        });

        bank = temp.sort(() => Math.random() - 0.5).slice(0, 50);
        current = 0; answers = {}; revealed = {}; isFinished = false;
        document.getElementById('setupBox').style.display = "none";
        document.getElementById('quizBox').style.display = "block";
        render();
    } catch (e) { alert("讀取錯誤: " + e.message); }
}

function render() {
    const item = bank[current];
    const showResult = isFinished || revealed[current];
    let html = `<h3>Q${current + 1}. ${item.q}</h3>`;

    item.opts.forEach((opt, i) => {
        let cls = "opt";
        if (answers[current] === i) cls += " selected";
        if (showResult) {
            if (i === item.ans) cls += " correct";
            else if (answers[current] === i) cls += " wrong";
        }
        html += `<button class="${cls}" onclick="selectOpt(${i})">${opt}</button>`;
    });

    if (showResult) html += `<div class="exp-box"><b>💡 解析：</b><br>${item.exp}</div>`;
    document.getElementById('qArea').innerHTML = html;
    
    // 更新網格
    document.getElementById('navGrid').innerHTML = bank.map((it, i) => {
        let cls = "dot";
        if (i === current) cls += " active";
        if (isFinished) {
            cls += (answers[i] === it.ans) ? " score-correct" : " score-wrong";
        } else if (answers[i] !== undefined) {
            cls += " done";
        }
        return `<div class="${cls}" onclick="current=${i};render()">${i+1}</div>`;
    }).join('');
}

function selectOpt(i) {
    if (isFinished) return; // 交卷後不能改答案，但可以點擊看題目
    answers[current] = i;
    render();
}

function move(step) {
    let next = current + step;
    if (next >= 0 && next < bank.length) { current = next; render(); }
}

function submitExam() {
    if (!confirm("確定要交卷嗎？送出後可點擊下方題號查看每一題的對錯。")) return;
    
    isFinished = true;
    let correct = 0;
    bank.forEach((it, i) => { if (answers[i] === it.ans) correct++; });

    const score = Math.round((correct / bank.length) * 100);
    
    // 顯示分數看板
    document.getElementById('scoreBoard').style.display = "block";
    document.getElementById('finalScoreText').textContent = score + " 分";
    document.getElementById('scoreDetailText').textContent = `答對：${correct} 題 | 答錯：${bank.length - correct} 題`;
    document.getElementById('finishBtn').style.display = "none"; // 隱藏交卷按鈕
    
    current = 0; // 回到第一題讓使用者開始檢討
    render();
}
</script>
</body>
</html>
