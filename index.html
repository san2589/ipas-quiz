<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>iPAS 模擬考系統 - 全方位相容版</title>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --brand:#2dd4bf; --text:#f1f5f9; }
        body { background:var(--bg); color:var(--text); font-family: sans-serif; margin:0; padding:20px; line-height:1.6; }
        .wrap { max-width:800px; margin:0 auto; }
        .card { background:var(--card); padding:20px; border-radius:12px; border:1px solid #334155; margin-bottom:15px; }
        .btn { background:#334155; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; margin-right:8px; margin-bottom:5px; }
        .btn:hover { background: #475569; }
        .btn-active { background:var(--brand) !important; color:#0f172a !important; }
        .opt { width:100%; text-align:left; padding:15px; background:#0f172a; border:1px solid #334155; color:white; border-radius:8px; margin-bottom:10px; cursor:pointer; font-size:16px; }
        .opt.selected { border-color:var(--brand); background:rgba(45,212,191,0.1); }
        .opt.correct { background:rgba(34,197,94,0.2); border-color:#22c55e; }
        .opt.wrong { background:rgba(251,113,133,0.2); border-color:#fb7185; }
        .nav-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap:8px; margin-top:10px; }
        .dot { background:#0f172a; border:1px solid #334155; text-align:center; padding:8px 0; border-radius:5px; cursor:pointer; font-size:12px; color:#94a3b8; }
        .dot.active { border-color:var(--brand); color:var(--brand); font-weight:bold; }
        .dot.done { background:#334155; color:#fff; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h2 style="color:var(--brand); margin-top:0;">iPAS 模擬考系統</h2>
        <button class="btn" id="btnAi" onclick="loadAndRepair('ipas_questions_ai.json')">載入 AI 規劃師</button>
        <button class="btn" id="btnAll" onclick="loadAndRepair('ipas_questions_all.json')">載入全部題庫</button>
        <div id="status" style="margin-top:10px; font-size:14px; color:#94a3b8;">請點擊按鈕載入資料</div>
    </div>
    <div id="quizBox" style="display:none;">
        <div class="card">
            <div id="qArea"></div>
            <div style="display:flex; justify-content:space-between; margin-top:20px;">
                <button class="btn" onclick="move(-1)">上一題</button>
                <button class="btn" onclick="revealed[current]=true;render()">看解析</button>
                <button class="btn" onclick="move(1)">下一題</button>
            </div>
        </div>
        <div class="card"><div id="navGrid" class="nav-grid"></div></div>
    </div>
</div>

<script>
let bank = [], current = 0, answers = {}, revealed = {};

async function loadAndRepair(name) {
    const status = document.getElementById('status');
    status.textContent = "正在深度解析檔案：" + name;
    
    document.getElementById('btnAi').classList.toggle('btn-active', name.includes('ai'));
    document.getElementById('btnAll').classList.toggle('btn-active', name.includes('all'));

    try {
        const res = await fetch(name + "?v=" + Date.now());
        const text = await res.text();
        
        // --- 核心解析改動：同時支持多種切割點 ---
        // 我們根據「題目起始鍵名」來切分題目
        const rawBlocks = text.split(/\{[\s\n\r]*"(?:id|q|question)"/); 
        let temp = [];

        rawBlocks.forEach(block => {
            if (!block.trim()) return;

            // 輔助函式：用來抓取被引號包住的值
            const getVal = (key) => {
                const reg = new RegExp(`"${key}"\\s*:\\s*"([\\s\\S]*?)"(?=[\\s\\n]*,|[\\s\\n]*\\}|[\\s\\n]*\\])`);
                const m = block.match(reg);
                return m ? m[1].replace(/\\"/g, '"') : "";
            };

            // 1. 抓題目 (question 為 ai 版, q 為 all 版)
            let q = getVal("question") || getVal("q");
            // 如果 q 還是抓不到，可能是因為 all 版的 q 前面那個切割點把它切掉了
            if (!q) {
                const altMatch = block.match(/^\s*:\s*"([\s\S]*?)"/);
                if (altMatch) q = altMatch[1].replace(/\\"/g, '"');
            }
            if (!q) return;

            // 2. 抓答案 (answer 為 ai 版, c 為 all 版)
            let ans = getVal("answer");
            let cVal = "";
            if (!ans) {
                const cMatch = block.match(/"c"\s*:\s*"(\d)"/) || block.match(/"c"\s*:\s*(\d)/);
                cVal = cMatch ? cMatch[1] : "";
            }

            // 3. 抓解析 (analysis 為 ai 版, e 為 all 版)
            let exp = getVal("analysis") || getVal("e");

            // 4. 抓選項
            let opts = [];
            if (block.includes('"options"')) {
                // AI 版選項格式
                ["A","B","C","D"].forEach(l => {
                    const o = getVal(l);
                    if (o) opts.push(o);
                });
            } else if (block.includes('"a"')) {
                // ALL 版選項格式 "a": ["...", "..."]
                const aMatch = block.match(/"a"\s*:\s*\[([\s\S]*?)\]/);
                if (aMatch) {
                    // 將字串陣列拆開，並移除引號與換行
                    opts = aMatch[1].split('",').map(s => s.replace(/[\[\]" \n\r]/g, '').trim()).filter(s => s !== "");
                }
            }

            if (q && opts.length >= 2) {
                const lMap = {"A":0, "B":1, "C":2, "D":3};
                temp.push({
                    q: q,
                    opts: opts,
                    ans: ans ? lMap[ans] : (parseInt(cVal)-1),
                    exp: exp || "本題暫無解析。"
                });
            }
        });

        if (temp.length === 0) throw new Error("解析完成但找不到有效題目");

        bank = temp.sort(() => Math.random() - 0.5).slice(0, 50);
        current = 0; answers = {}; revealed = {};
        document.getElementById('quizBox').style.display = "block";
        status.textContent = "✅ 成功載入！來源總數：" + temp.length + " 題，已隨機抽樣 50 題。";
        render();
    } catch (e) {
        status.textContent = "❌ 解析失敗: " + e.message;
        console.error(e);
    }
}

function render() {
    const item = bank[current];
    let html = `<h3 style="margin-bottom:20px;">Q${current+1}. ${item.q}</h3>`;
    item.opts.forEach((opt, i) => {
        let cls = "opt" + (answers[current] === i ? " selected" : "");
        if (revealed[current]) {
            if (i === item.ans) cls += " correct";
            else if (answers[current] === i) cls += " wrong";
        }
        html += `<button class="${cls}" onclick="if(!revealed[current]){answers[current]=i;render()}">${opt}</button>`;
    });
    if (revealed[current]) {
        html += `<div style="padding:15px; background:rgba(45,212,191,0.1); border-left:4px solid var(--brand); margin-top:15px; border-radius:4px;"><b>💡 解析：</b><br>${item.exp}</div>`;
    }
    document.getElementById('qArea').innerHTML = html;
    document.getElementById('navGrid').innerHTML = bank.map((_,i) => `<div class="dot ${i===current?'active':''} ${answers[i]!==undefined?'done':''}" onclick="current=${i};render()">${i+1}</div>`).join('');
}

function move(s) { let n = current + s; if(n>=0 && n<bank.length) { current=n; render(); } }
</script>
</body>
</html>
