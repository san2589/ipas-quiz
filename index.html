<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>iPAS 模擬考系統 (修復完成)</title>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --brand:#2dd4bf; --text:#f1f5f9; }
        body { background:var(--bg); color:var(--text); font-family: sans-serif; margin:0; padding:20px; }
        .wrap { max-width:800px; margin:0 auto; }
        .card { background:var(--card); padding:20px; border-radius:12px; border:1px solid #334155; margin-bottom:15px; }
        .btn { background:#334155; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; margin-right:5px; margin-bottom:5px; }
        .btn-active { background:var(--brand) !important; color:#0f172a !important; }
        .opt { width:100%; text-align:left; padding:15px; background:#0f172a; border:1px solid #334155; color:white; border-radius:8px; margin-bottom:10px; cursor:pointer; font-size:16px; }
        .opt.selected { border-color:var(--brand); background:rgba(45,212,191,0.1); }
        .opt.correct { background:rgba(34,197,94,0.2); border-color:#22c55e; }
        .opt.wrong { background:rgba(251,113,133,0.2); border-color:#fb7185; }
        .nav-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(35px, 1fr)); gap:5px; margin-top:10px; }
        .dot { background:#0f172a; border:1px solid #334155; text-align:center; padding:5px 0; border-radius:5px; cursor:pointer; font-size:12px; }
        .dot.active { border-color:var(--brand); color:var(--brand); }
        .dot.done { background:#475569; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h2 style="color:var(--brand); margin-top:0;">iPAS 模擬考系統</h2>
        <button class="btn" id="btnAi" onclick="fetchData('ipas_questions_ai.json')">AI 規劃師 (A/B/C/D 版)</button>
        <button class="btn" id="btnAll" onclick="fetchData('ipas_questions_all.json')">全部題庫 (1/2/3/4 版)</button>
        <div id="msg" style="margin-top:10px; font-size:13px; color:#94a3b8;">請確保 JSON 檔案放在 HTML 旁邊</div>
    </div>

    <div id="quizBox" style="display:none;">
        <div class="card">
            <div id="qArea"></div>
            <div style="display:flex; justify-content:space-between; margin-top:20px;">
                <button class="btn" onclick="move(-1)">上一題</button>
                <button class="btn" onclick="showHelp()">看解析</button>
                <button class="btn" onclick="move(1)">下一題</button>
            </div>
            <button class="btn" onclick="finish()" style="width:100%; margin-top:10px; background:var(--brand); color:#000;">交卷看分數</button>
        </div>
        <div class="card">
            <div id="navGrid" class="nav-grid"></div>
        </div>
    </div>
</div>

<script>
let bank = [], current = 0, answers = {}, revealed = {}, isDone = false;

async function fetchData(fileName) {
    const msg = document.getElementById('msg');
    msg.textContent = "讀取中：" + fileName;
    
    document.getElementById('btnAi').classList.toggle('btn-active', fileName.includes('ai'));
    document.getElementById('btnAll').classList.toggle('btn-active', fileName.includes('all'));

    try {
        const res = await fetch(fileName + "?v=" + Date.now());
        if (!res.ok) throw new Error("讀不到檔案 " + fileName);
        const data = await res.json(); // 這次直接用 JSON 解析
        
        let temp = [];
        const letterMap = {"A":0, "B":1, "C":2, "D":3};

        data.forEach(item => {
            let parsed = { q: "", opts: [], ans: 0, exp: "" };

            // 針對 ai.json 的格式 (有 question, options, answer)
            if (item.options) {
                parsed.q = item.question;
                parsed.opts = [item.options.A, item.options.B, item.options.C, item.options.D];
                parsed.ans = letterMap[item.answer];
                parsed.exp = item.analysis;
            } 
            // 針對 all.json 的格式 (有 q, a, c)
            else if (item.a) {
                parsed.q = item.q;
                parsed.opts = item.a;
                parsed.ans = parseInt(item.c) - 1; // 數字 1-4 轉索引 0-3
                parsed.exp = item.e;
            }

            if (parsed.q) temp.push(parsed);
        });

        bank = temp.sort(() => Math.random() - 0.5).slice(0, 50);
        current = 0; answers = {}; revealed = {}; isDone = false;
        document.getElementById('quizBox').style.display = 'block';
        msg.textContent = "✅ 已成功載入 " + bank.length + " 題";
        render();
    } catch (e) {
        msg.innerHTML = "<span style='color:#fb7185'>❌ 錯誤: " + e.message + "</span>";
    }
}

function render() {
    const item = bank[current];
    const show = isDone || revealed[current];
    let html = `<h3 style="line-height:1.5">${current + 1}. ${item.q}</h3>`;
    
    item.opts.forEach((opt, i) => {
        let cls = "opt";
        if (answers[current] === i) cls += " selected";
        if (show) {
            if (i === item.ans) cls += " correct";
            else if (answers[current] === i) cls += " wrong";
        }
        html += `<button class="${cls}" onclick="pick(${i})">${opt}</button>`;
    });

    if (show) html += `<div style="margin-top:15px; padding:15px; background:rgba(45,212,191,0.05); border-left:4px solid var(--brand);"><b>💡 解析：</b><br>${item.exp || "此題無解析"}</div>`;
    document.getElementById('qArea').innerHTML = html;

    document.getElementById('navGrid').innerHTML = bank.map((_, i) => {
        let cls = "dot" + (i === current ? " active" : (answers[i] !== undefined ? " done" : ""));
        return `<div class="${cls}" onclick="current=${i};render()">${i+1}</div>`;
    }).join('');
}

function pick(i) { if(!isDone) { answers[current] = i; render(); } }
function move(s) { let n = current + s; if(n>=0 && n<bank.length) { current = n; render(); } }
function showHelp() { revealed[current] = true; render(); }
function finish() { if(confirm("確定交卷？")) { isDone = true; render(); } }
</script>
</body>
</html>
