<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>iPAS 測驗 - 2026 最新版</title>
  <style>
    :root { --bg:#0b1220; --card:#121a2a; --muted:#94a3b8; --text:#e5e7eb; --brand:#14b8a6; --danger:#ef4444; --ok:#22c55e; }
    body{ margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    .wrap{ max-width:1100px; margin:0 auto; padding:16px; }
    .card{ background:var(--card); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 15px; }
    .btn{ border:0; border-radius:10px; padding:10px 16px; cursor:pointer; font-weight:800; transition: 0.2s; }
    .btn-gray{ background:#334155; color:white; }
    .btn-brand{ background:var(--brand); color:white; }
    .btn-danger{ background:rgba(239,68,68,0.2); color:#ff8a8a; border:1px solid var(--danger); }
    .btn-active{ outline: 3px solid white; box-shadow: 0 0 15px var(--brand); }
    .opt{ width:100%; text-align:left; padding:15px; border-radius:12px; border:1px solid #334155; background:#1e293b; color:white; cursor:pointer; margin-bottom:10px; font-size:16px; }
    .opt:hover{ border-color:var(--brand); }
    .opt.selected{ border-color:var(--brand); background:rgba(20,184,166,0.1); }
    .opt.correct{ border-color:var(--ok); background:rgba(34,197,94,0.1); }
    .opt.wrong{ border-color:var(--danger); background:rgba(239,68,68,0.1); }
    .progress-bg{ height:8px; background:#334155; border-radius:4px; overflow:hidden; margin:10px 0; }
    .progress-bar{ height:100%; background:var(--brand); width:0%; transition:0.3s; }
    .q-title{ font-size:20px; font-weight:900; margin-bottom:20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div class="row">
          <button id="btn-all" class="btn btn-gray" onclick="changeLib('./ipas_questions_all.json')">全部題庫</button>
          <button id="btn-ai" class="btn btn-gray" onclick="changeLib('./ipas_questions_ai.json')">AI 應用規劃師</button>
        </div>
        <button class="btn btn-danger" onclick="resetProgress()">清除進度</button>
      </div>

      <div id="info" style="font-size:12px; color:var(--muted); margin-bottom:10px;">讀取中...</div>
      <div class="progress-bg"><div id="bar" class="progress-bar"></div></div>
      <div id="stat" style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:20px;">
        <span id="prog-text">0 / 0</span>
        <span id="score-text">正確: 0 | 錯誤: 0</span>
      </div>

      <div id="quiz-box"></div>

      <div class="row" style="justify-content:space-between; margin-top:30px;">
        <button class="btn btn-gray" onclick="move(-1)">上一題</button>
        <button id="btn-reveal" class="btn btn-gray" onclick="reveal()">看答案</button>
        <button class="btn btn-brand" onclick="move(1)">下一題</button>
      </div>
    </div>
  </div>

<script>
(() => {
    // 優先讀取上次選擇的題庫，否則預設 AI
    let currentLib = localStorage.getItem("active_lib") || "./ipas_questions_ai.json";
    const LS_KEY = "quiz_save_" + currentLib; // 讓不同題庫進度分開存

    let questions = [], currentIndex = 0, answers = {}, revealed = {};

    window.changeLib = (url) => {
        localStorage.setItem("active_lib", url);
        location.reload(); // 切換題庫會重刷
    };

    window.resetProgress = () => {
        if(confirm("確定要清除目前題庫的進度並重新出題嗎？")){
            localStorage.removeItem(LS_KEY);
            location.reload();
        }
    };

    async function init() {
        // 標記目前按鈕
        if(currentLib.includes("ai")) document.getElementById("btn-ai").classList.add("btn-active");
        else document.getElementById("btn-all").classList.add("btn-active");
        
        document.getElementById("info").textContent = "當前題庫：" + currentLib;

        try {
            const res = await fetch(currentLib + "?t=" + Date.now()); // 加時間戳防止快取
            const data = await res.json();
            
            // 隨機抽 50 題
            questions = data.sort(() => Math.random() - 0.5).slice(0, 50).map((q, i) => ({
                id: q.id || i,
                title: q.q || q.question,
                opts: q.a || q.options,
                ans: (typeof q.c === 'number' ? q.c - 1 : q.c)
            }));

            // 讀取進度
            const saved = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
            answers = saved.answers || {};
            currentIndex = saved.currentIndex || 0;

            render();
        } catch (e) {
            document.getElementById("quiz-box").innerHTML = "題庫載入失敗，請確認檔案是否存在。";
        }
    }

    function render() {
        const q = questions[currentIndex];
        const box = document.getElementById("quiz-box");
        const isRev = revealed[currentIndex];
        const userAns = answers[currentIndex];

        let html = `<div class="q-title">${currentIndex + 1}. ${q.title}</div>`;
        q.opts.forEach((opt, i) => {
            let cls = "opt";
            if (userAns === i) cls += " selected";
            if (isRev) {
                if (i === q.ans) cls += " correct";
                else if (userAns === i) cls += " wrong";
            }
            html += `<button class="${cls}" onclick="handleChoose(${i})">${opt}</button>`;
        });
        box.innerHTML = html;

        // 更新 UI
        document.getElementById("bar").style.width = ((currentIndex + 1) / questions.length * 100) + "%";
        document.getElementById("prog-text").textContent = `第 ${currentIndex + 1} / ${questions.length} 題`;
        
        // 自動存檔
        localStorage.setItem(LS_KEY, JSON.stringify({ answers, currentIndex }));
    }

    window.handleChoose = (i) => {
        answers[currentIndex] = i;
        render();
    };

    window.move = (step) => {
        let next = currentIndex + step;
        if (next >= 0 && next < questions.length) {
            currentIndex = next;
            render();
        }
    };

    window.reveal = () => {
        revealed[currentIndex] = true;
        render();
    };

    init();
})();
</script>
</body>
</html>
